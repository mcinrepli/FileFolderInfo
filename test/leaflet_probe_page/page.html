<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; }
  #status { position: absolute; z-index: 1000; top: 8px; left: 50px; background: white;
            padding: 4px 8px; font-family: sans-serif; font-size: 13px; border-radius: 4px; }
</style>
</head>
<body>
<div id="status">tiles loaded: 0</div>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
  // Киев, раз уж тестируем — реальные координаты, не заглушка
  var map = L.map('map').setView([50.4501, 30.5234], 12);

  var tileCount = 0;
  var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  tiles.on('tileload', function() {
    tileCount++;
    document.getElementById('status').innerText = 'tiles loaded: ' + tileCount;
  });
  tiles.on('tileerror', function(e) {
    document.getElementById('status').innerText = 'tile ERROR: ' + (e && e.error ? e.error : '?');
  });

  // Простой маркер без внешних иконок — circleMarker, ничего дополнительно грузить не нужно
  L.circleMarker([50.4501, 30.5234], {radius: 8, color: 'red', fillColor: 'red', fillOpacity: 0.8})
    .addTo(map)
    .bindPopup('\u0422\u0435\u0441\u0442\u043E\u0432\u0430\u044F \u0442\u043E\u0447\u043A\u0430')
    .openPopup();
</script>
</body>
</html>
